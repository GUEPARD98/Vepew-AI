title: LSASS Memory Access for Credential Extraction
id: vpew-r2-credential-access
description: Detects access to LSASS memory for credential dumping attempts
status: experimental
author: VPEW-AI Team
date: 2024/01/01
modified: 2024/01/01
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/gentilkiwi/mimikatz
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.s0002
logsource:
    category: process_access
    product: windows
    service: sysmon
detection:
    selection:
        EventID: 10
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1038' 
            - '0x143a'
            - '0x1fffff'
    filter_legitimate:
        SourceImage|endswith:
            - '\wmiprvse.exe'
            - '\taskmgr.exe'
            - '\procexp64.exe'
            - '\procexp.exe'
            - '\MsMpEng.exe'
    condition: selection and not filter_legitimate
level: high
falsepositives:
    - Security software accessing LSASS
    - System monitoring tools
    - Windows Defender operations
